<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <!-- Gradients & Accents -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d99f44" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#52525b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .iso-line { stroke: rgba(161, 161, 170, 0.32); stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .iso-line-amber { stroke: rgba(217, 159, 68, 0.55); stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .iso-line-sage { stroke: rgba(136, 158, 136, 0.45); stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .iso-fill-subtle { fill: rgba(217, 159, 68, 0.04); }
    .iso-fill-slate { fill: rgba(255, 255, 255, 0.02); }
    .iso-fill-valve { fill: rgba(217, 159, 68, 0.08); }
    .iso-dash { stroke: rgba(217, 159, 68, 0.35); stroke-width: 0.9; stroke-dasharray: 3 3; fill: none; }
    .iso-text { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; fill: rgba(217, 159, 68, 0.45); letter-spacing: 0.5px; }
    .iso-bolt { fill: rgba(217, 159, 68, 0.7); }
    .iso-node { fill: rgba(136, 158, 136, 0.75); }
  </style>

  <!-- =====================================================================
       ASSEMBLY 1: RECTANGULAR HVAC DUCT WITH CROSS-CREASES & FLANGES
       Position: Top Left (x: 20-190, y: 30-120)
       ===================================================================== -->
  <g id="hvac-duct-run">
    <!-- Duct Segment 1: Main Body -->
    <!-- Top Face (Isometric 30 deg) -->
    <polygon points="30,65 110,19 145,39 65,85" class="iso-fill-subtle iso-line-amber" />
    <!-- Stiffening Cross Creases on Top Face -->
    <line x1="30" y1="65" x2="145" y2="39" class="iso-dash" />
    <line x1="110" y1="19" x2="65" y2="85" class="iso-dash" />

    <!-- Side Face (Vertical drop 28px) -->
    <polygon points="30,65 65,85 65,113 30,93" class="iso-fill-slate iso-line" />
    <!-- Front Face (Right end) -->
    <polygon points="65,85 145,39 145,67 65,113" class="iso-fill-subtle iso-line" />
    <!-- Stiffening Cross Crease on Front Face -->
    <line x1="65" y1="85" x2="145" y2="67" class="iso-dash" />
    <line x1="145" y1="39" x2="65" y2="113" class="iso-dash" />

    <!-- Transverse Connection Flange (Brida de unión) at x=65, y=85 -->
    <polygon points="63,84 63,115 67,115 67,84" class="iso-line-amber" />
    <polygon points="63,84 147,38 147,42 63,88" class="iso-line-amber" />
    <circle cx="63" cy="85" r="1.3" class="iso-bolt" />
    <circle cx="65" cy="113" r="1.3" class="iso-bolt" />
    <circle cx="145" cy="39" r="1.3" class="iso-bolt" />
    <circle cx="145" cy="67" r="1.3" class="iso-bolt" />

    <!-- Air Volume Control Damper (Compuerta de regulación) -->
    <!-- Actuator / manual control quadrant -->
    <polygon points="100,24 100,10 112,17 112,31" class="iso-fill-valve iso-line-amber" />
    <line x1="106" y1="13" x2="118" y2="20" class="iso-line-amber" />
    <circle cx="118" cy="20" r="1.8" class="iso-node" />
    <!-- Damper internal blade indicators -->
    <line x1="90" y1="52" x2="115" y2="37" class="iso-line-amber" />
    <line x1="85" y1="62" x2="110" y2="47" class="iso-line-amber" />

    <text x="70" y="32" class="iso-text" transform="rotate(-30 70 32)">400x250</text>
  </g>

  <!-- =====================================================================
       ASSEMBLY 2: FLANGED GATE VALVE & VERTICAL RISER PIPE
       Position: Top Right (x: 270-460, y: 25-150)
       ===================================================================== -->
  <g id="piping-valve-assembly">
    <!-- Horizontal Pipe (150 deg axis) -->
    <!-- Centerline -->
    <line x1="450" y1="40" x2="280" y2="138" class="iso-dash" />

    <!-- Upper Pipe Wall -->
    <line x1="446" y1="33" x2="385" y2="68" class="iso-line" />
    <line x1="355" y1="85" x2="310" y2="111" class="iso-line" />
    <!-- Lower Pipe Wall -->
    <line x1="454" y1="47" x2="393" y2="82" class="iso-line" />
    <line x1="363" y1="99" x2="318" y2="125" class="iso-line" />

    <!-- Gate Valve (Válvula de compuerta embridada) at (370, 84) -->
    <!-- Flange 1 (Inlet) -->
    <ellipse cx="389" cy="75" rx="4" ry="11" transform="rotate(-30 389 75)" class="iso-fill-valve iso-line-amber" />
    <!-- Flange 2 (Outlet) -->
    <ellipse cx="359" cy="92" rx="4" ry="11" transform="rotate(-30 359 92)" class="iso-fill-valve iso-line-amber" />
    <!-- Valve Body (Cast housing) -->
    <polygon points="385,69 363,86 363,98 385,81" class="iso-fill-valve iso-line-amber" />
    <polygon points="389,75 367,88 375,102 397,89" class="iso-fill-subtle iso-line-amber" />

    <!-- Valve Bonnet & Stem (Vástago vertical) -->
    <line x1="374" y1="80" x2="374" y2="52" class="iso-line-amber" stroke-width="2" />
    <rect x="371" y="58" width="6" height="5" class="iso-fill-valve iso-line-amber" />

    <!-- Isometric Circular Handwheel (Volante de maniobra) -->
    <ellipse cx="374" cy="50" rx="16" ry="8" class="iso-fill-valve iso-line-amber" stroke-width="1.4" />
    <ellipse cx="374" cy="50" rx="5" ry="2.5" class="iso-fill-slate iso-line-amber" />
    <!-- Handwheel spokes -->
    <line x1="358" y1="50" x2="390" y2="50" class="iso-line-amber" />
    <line x1="366" y1="43" x2="382" y2="57" class="iso-line-amber" />
    <line x1="366" y1="57" x2="382" y2="43" class="iso-line-amber" />

    <!-- 90 Degree Smooth Radius Elbow (Codo 90 isométrico girando hacia abajo) -->
    <!-- Outer Arc -->
    <path d="M 310,111 A 18,18 0 0,0 292,129 L 292,175" class="iso-line" />
    <!-- Inner Arc -->
    <path d="M 318,125 A 6,6 0 0,0 306,137 L 306,175" class="iso-line" />
    <!-- Weld Seam line -->
    <line x1="309" y1="108" x2="319" y2="127" class="iso-dash" />

    <!-- Flow Arrow on Pipe -->
    <polygon points="420,53 428,51 426,59" class="iso-bolt" />
    <text x="412" y="47" class="iso-text" transform="rotate(30 412 47)">DN65 CHW-S</text>
  </g>

  <!-- =====================================================================
       ASSEMBLY 3: CONCENTRIC REDUCER, Y-STRAINER & SENSOR
       Position: Bottom Right (x: 260-470, y: 190-330)
       ===================================================================== -->
  <g id="strainer-and-reducer">
    <!-- Large Pipe DN80 -->
    <line x1="260" y1="210" x2="310" y2="239" class="iso-line" />
    <line x1="260" y1="228" x2="310" y2="257" class="iso-line" />

    <!-- Concentric Reducer (Reducción concéntrica) -->
    <polygon points="310,239 340,250 340,262 310,257" class="iso-fill-subtle iso-line-amber" />
    <ellipse cx="310" cy="248" rx="3" ry="9" class="iso-line" />
    <ellipse cx="340" cy="256" rx="2" ry="6" class="iso-line-amber" />

    <!-- Y-Strainer (Filtro en Y) at (365, 270) -->
    <!-- Main flow body -->
    <line x1="340" y1="250" x2="410" y2="290" class="iso-line" />
    <line x1="340" y1="262" x2="410" y2="302" class="iso-line" />
    <!-- Straining leg (branch angled downwards) -->
    <polygon points="365,274 378,300 392,298 380,278" class="iso-fill-valve iso-line-amber" />
    <!-- Cleanout cap / brida de purga con tuerca -->
    <ellipse cx="385" cy="299" rx="7" ry="4" transform="rotate(30 385 299)" class="iso-line-amber" />
    <rect x="383" y="297" width="4" height="4" class="iso-bolt" />

    <!-- Pressure Gauge with Syphon (Manómetro con lira) -->
    <!-- Half-coupling boss -->
    <circle cx="285" cy="225" r="2.5" class="iso-fill-valve iso-line-amber" />
    <!-- Syphon pigtail coil -->
    <path d="M 285,225 L 285,208 C 285,202 295,202 295,208 C 295,214 285,214 285,200 L 285,190" class="iso-line-amber" />
    <!-- Gauge round dial -->
    <circle cx="285" cy="180" r="10" class="iso-fill-valve iso-line-amber" stroke-width="1.3" />
    <circle cx="285" cy="180" r="8" class="iso-line" />
    <!-- Dial ticks and needle -->
    <line x1="285" y1="180" x2="289" y2="174" class="iso-line-amber" stroke-width="1.2" />
    <line x1="277" y1="180" x2="279" y2="180" class="iso-line" />
    <line x1="291" y1="180" x2="293" y2="180" class="iso-line" />
    <line x1="285" y1="172" x2="285" y2="174" class="iso-line" />
    <circle cx="285" cy="180" r="1.5" class="iso-bolt" />

    <text x="350" y="320" class="iso-text">Y-STRAINER DN50</text>
  </g>

  <!-- =====================================================================
       ASSEMBLY 4: TEE BRANCH, BALL VALVE & FLEXIBLE CONNECTION
       Position: Bottom Left (x: 20-220, y: 170-340)
       ===================================================================== -->
  <g id="branch-and-ball-valve">
    <!-- Main Run (30 deg axis) -->
    <line x1="20" y1="210" x2="210" y2="320" class="iso-line" />
    <line x1="20" y1="224" x2="210" y2="334" class="iso-line" />

    <!-- Equal Tee Fitting (Te de derivación a 90 deg) at (105, 264) -->
    <!-- Branch running along 150 deg axis -->
    <line x1="100" y1="261" x2="160" y2="226" class="iso-line" />
    <line x1="112" y1="268" x2="172" y2="233" class="iso-line" />
    <!-- Tee body fillet arcs -->
    <path d="M 94,252 Q 100,261 100,261" class="iso-line-amber" />
    <path d="M 112,268 Q 120,273 130,278" class="iso-line-amber" />

    <!-- Ball Valve on Branch (Válvula de bola con palanca) -->
    <ellipse cx="140" cy="238" rx="4" ry="7" transform="rotate(-30 140 238)" class="iso-fill-valve iso-line-amber" />
    <ellipse cx="152" cy="231" rx="4" ry="7" transform="rotate(-30 152 231)" class="iso-fill-valve iso-line-amber" />
    <!-- Stem & Quarter-turn Lever Handle (Palanca inclinada) -->
    <line x1="146" y1="234" x2="146" y2="222" class="iso-line-amber" stroke-width="2" />
    <polygon points="144,222 175,204 177,207 146,225" class="iso-fill-valve iso-line-amber" />
    <!-- Vinyl grip sleeve -->
    <line x1="158" y1="214" x2="175" y2="204" stroke="#d99f44" stroke-width="3" stroke-linecap="round" />

    <!-- Pipe Clevis Hanger (Soporte colgador de tubería con varilla) -->
    <line x1="60" y1="160" x2="60" y2="228" class="iso-dash" stroke-width="1.2" />
    <!-- Ceiling anchor plate -->
    <rect x="54" y="158" width="12" height="3" class="iso-line-sage" />
    <!-- Threaded rod nuts -->
    <rect x="58" y="195" width="4" height="4" class="iso-bolt" />
    <rect x="58" y="222" width="4" height="4" class="iso-bolt" />
    <!-- Pipe clamp loop -->
    <path d="M 52,228 A 10,10 0 0,0 68,228 L 68,242 A 10,10 0 0,1 52,242 Z" class="iso-fill-subtle iso-line-amber" />

    <text x="125" y="212" class="iso-text" transform="rotate(-30 125 212)">BALL VALVE 1-1/2"</text>
  </g>

  <!-- =====================================================================
       ASSEMBLY 5: CEILING AIR DIFFUSER & INTERCONNECTED DUCT
       Position: Bottom Center (x: 180-300, y: 120-200)
       ===================================================================== -->
  <g id="air-terminal-diffuser">
    <!-- Flexible round duct connection neck (Cuello circular) -->
    <ellipse cx="230" cy="130" rx="14" ry="7" class="iso-fill-subtle iso-line" />
    <path d="M 216,130 L 216,145 M 244,130 L 244,145" class="iso-line" />
    <!-- Flex ribs -->
    <ellipse cx="230" cy="135" rx="14" ry="7" class="iso-dash" />
    <ellipse cx="230" cy="140" rx="14" ry="7" class="iso-dash" />

    <!-- Square Ceiling Diffuser Frame (Marco exterior en 30 deg) -->
    <polygon points="230,150 270,173 230,196 190,173" class="iso-fill-slate iso-line-amber" stroke-width="1.3" />
    <!-- Inner Concentric Louver Tier 1 -->
    <polygon points="230,156 260,173 230,190 200,173" class="iso-line" />
    <!-- Inner Concentric Louver Tier 2 -->
    <polygon points="230,162 250,173 230,184 210,173" class="iso-line" />
    <!-- Center Core Plate -->
    <polygon points="230,167 240,173 230,178 220,173" class="iso-fill-valve iso-line-amber" />

    <text x="210" y="206" class="iso-text">DIFFUSER 600x600</text>
  </g>

  <!-- =====================================================================
       ASSEMBLY 6: OVERHEAD PERFORATED CABLE TRAY (Interdisciplinary BIM)
       Position: Top Center Crossing Over
       ===================================================================== -->
  <g id="cable-tray-overhead">
    <!-- Left Rail -->
    <line x1="170" y1="15" x2="260" y2="67" class="iso-line-sage" stroke-width="1.4" />
    <line x1="170" y1="21" x2="260" y2="73" class="iso-line-sage" stroke-width="1.4" />
    <!-- Right Rail (Width 30px) -->
    <line x1="196" y1="0" x2="286" y2="52" class="iso-line-sage" stroke-width="1.4" />
    <line x1="196" y1="6" x2="286" y2="58" class="iso-line-sage" stroke-width="1.4" />

    <!-- Cross Rungs (Peldaños de bandeja a intervalos regulares) -->
    <line x1="175" y1="18" x2="201" y2="3" class="iso-line-sage" />
    <line x1="190" y1="27" x2="216" y2="12" class="iso-line-sage" />
    <line x1="205" y1="35" x2="231" y2="20" class="iso-line-sage" />
    <line x1="220" y1="44" x2="246" y2="29" class="iso-line-sage" />
    <line x1="235" y1="53" x2="261" y2="38" class="iso-line-sage" />
    <line x1="250" y1="61" x2="276" y2="46" class="iso-line-sage" />

    <!-- BIM Coordination Clash-Free Tag -->
    <text x="215" y="10" class="iso-text" fill="rgba(136, 158, 136, 0.6)" transform="rotate(30 215 10)">CABLE TRAY 300x60</text>
  </g>

  <!-- =====================================================================
       SEAMLESS BORDER TIES (Seamless Repeating Anchor Nodes)
       ===================================================================== -->
  <g id="border-anchors">
    <!-- Top-left to bottom-right seamless tie pipe -->
    <line x1="0" y1="90" x2="30" y2="107" class="iso-dash" />
    <circle cx="0" cy="90" r="1.5" class="iso-node" />
    <line x1="450" y1="350" x2="480" y2="367" class="iso-dash" />
    <circle cx="480" cy="367" r="1.5" class="iso-node" />

    <!-- Top-right to bottom-left seamless tie -->
    <line x1="480" y1="23" x2="450" y2="40" class="iso-dash" />
    <circle cx="480" cy="23" r="1.5" class="iso-node" />
    <line x1="0" y1="299" x2="30" y2="316" class="iso-dash" />
    <circle cx="0" cy="299" r="1.5" class="iso-node" />
  </g>
</svg>